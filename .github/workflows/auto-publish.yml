name: Auto-Publish Blog Post

on:
  schedule:
    - cron: '0 11 * * *'  # 6 AM ET daily (11:00 UTC)
  workflow_dispatch: {}    # Manual trigger for testing

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "Prolific Bot"
          git config user.email "prolific-bot@users.noreply.github.com"

      - name: Run autonomous publisher
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_PROJECT: prolific-autonomous
          PYTHONPATH: .
        run: python -m prolific.autonomous.run
